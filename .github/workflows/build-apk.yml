name: Build ReteKey APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (install required components)
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: '36.0.0'
          components: 'platform-tools,platforms;android-36,build-tools;36.0.0'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build unsigned release APKs
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p built-apks
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} built-apks/ \;
          ls -lh built-apks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: retekey-release-apks
          path: built-apks/*.apk
          if-no-files-found: error
