name: Build ReteKey APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK command line tools
        run: |
          mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          rm -rf /usr/local/lib/android/sdk/cmdline-tools/latest
          mkdir -p /usr/local/lib/android/sdk/cmdline-tools/latest
          cp -r cmdline-tools/* /usr/local/lib/android/sdk/cmdline-tools/latest/
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build unsigned release APKs
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p built-apks
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} built-apks/ \;
          ls -lh built-apks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: retekey-release-apks
          path: built-apks/*.apk
          if-no-files-found: error
